services:
  postgres:
    # pgvector-Variante statt reinem postgres: Schritt 3 (Skill-Retrieval ueber
    # Embeddings) braucht die Extension, und ein Basiswechsel spaeter ist teurer.
    image: pgvector/pgvector:pg18
    container_name: agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
    ports:
      # 5433 als Default, weil auf Entwicklerrechnern haeufig schon ein Postgres
      # auf 5432 laeuft. Der Backend-Container spricht ohnehin postgres:5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 erwartet den Mount auf /var/lib/postgresql, nicht auf dem
      # data-Unterverzeichnis — sonst bricht der Start mit "unused mount/volume" ab.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: agent-backend:dev
    container_name: agent-backend
    ports:
      - "8080:8080"
    environment:
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}

      # --- Cloud (OpenAI oder jedes OpenAI-kompatible Gateway) ---
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # --- Lokal (LM Studio, Ollama, vLLM, llama.cpp, LiteLLM) ---
      # Laeuft der Server auf dem Host, muss hier host.docker.internal stehen.
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:1234/v1}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-not-needed}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-local-model}
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-true}

      # --- SOUL ---
      # Fuer eigene SOULs ohne Rebuild: ./souls hier mounten (siehe volumes unten)
      # und SOUL_LOCATIONS=classpath:souls/,file:/souls/ setzen.
      SOUL_LOCATIONS: ${SOUL_LOCATIONS:-classpath:souls/}
      SOUL_ACTIVE: ${SOUL_ACTIVE:-forge}

      # --- Datenbank (Runs + Traces) ---
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agent}
      DB_USER: ${POSTGRES_USER:-agent}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-agent}

      # --- Agent-Budget ---
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-20}
      AGENT_MAX_CALLS_PER_TOOL: ${AGENT_MAX_CALLS_PER_TOOL:-8}
      AGENT_MAX_DURATION_MS: ${AGENT_MAX_DURATION_MS:-180000}

      # --- MCP-Server (optional) ---
      # Beispielregistrierung gegen tools/mock-mcp-server.py auf dem Host.
      # Leer lassen, um keinen Server zu registrieren.
      APP_TOOLS_MCP_MOCK_ENABLED: ${MCP_MOCK_ENABLED:-false}
      APP_TOOLS_MCP_MOCK_LABEL: Mock-MCP
      APP_TOOLS_MCP_MOCK_TRANSPORT: HTTP
      APP_TOOLS_MCP_MOCK_URL: ${MCP_MOCK_URL:-http://host.docker.internal:3333/mcp}
    # volumes:
    #   - ./souls:/souls:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    image: agent-frontend:dev
    container_name: agent-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
