services:
  postgres:
    # pgvector variant instead of plain postgres: later retrieval over traces will want the
    # extension, and switching the base image later is costlier.
    image: pgvector/pgvector:pg18
    container_name: forge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
    ports:
      # 5433 as default because developer machines often already run a Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # The cluster lives under DATA_DIR/db on the host, next to the files. Postgres 18
      # expects the mount at /var/lib/postgresql, not at the data subdirectory.
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: forge-backend:dev
    container_name: forge-backend
    # A transient database hiccup at start (recovery mode after an unclean stop) must not
    # leave the backend dead until someone notices.
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Everything in .env reaches the container — including the API_KEY_* variables the
    # model files reference. Compose does not pass them through on its own.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container the data directory is always /data; the host side is DATA_DIR.
      DATA_DIR: /data
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-forge}
      DB_USER: ${POSTGRES_USER:-forge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      MCP_MOCK_URL: ${MCP_MOCK_URL:-http://host.docker.internal:3333/mcp}
      # Verification switches, normally empty (see .env.example).
      MODEL_BASE_URL_OVERRIDE: ${MODEL_BASE_URL_OVERRIDE:-}
      TOOLS_FIXED_TIME: ${TOOLS_FIXED_TIME:-}
    volumes:
      - ${DATA_DIR:-./data}/files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    image: forge-frontend:dev
    container_name: forge-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
