spring.application.name=agent-backend
server.port=8080

# Spring AI baut keine ChatModels selbst — das macht ChatClientRegistry aus
# app.ai.providers.*, damit mehrere Endpunkte parallel nutzbar sind.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# --- Modell-Endpunkte --------------------------------------------------------
# Alle Endpunkte sprechen das OpenAI-Protokoll. Ein lokaler Server ist damit
# kein Sonderfall, sondern nur eine andere base-url.
# base-url IMMER inkl. Versionspfad angeben, z. B. .../v1
app.ai.default-provider=${AI_DEFAULT_PROVIDER:openai}

# OpenAI (Cloud)
app.ai.providers.openai.label=OpenAI (Cloud)
app.ai.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.providers.openai.api-key=${OPENAI_API_KEY:not-set}
app.ai.providers.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.providers.openai.temperature=0.7

# Lokales Modell — jeder OpenAI-kompatible Server:
#   LM Studio    http://localhost:1234/v1
#   Ollama       http://localhost:11434/v1
#   vLLM         http://localhost:8000/v1
#   llama.cpp    http://localhost:8080/v1
# Aus dem Container heraus: host.docker.internal statt localhost.
app.ai.providers.local.label=Lokal (OpenAI-kompatibel)
app.ai.providers.local.base-url=${LOCAL_AI_BASE_URL:http://localhost:1234/v1}
app.ai.providers.local.api-key=${LOCAL_AI_API_KEY:not-needed}
app.ai.providers.local.model=${LOCAL_AI_MODEL:local-model}
app.ai.providers.local.temperature=0.7
# local=true: kein echter API-Key noetig, Provider gilt trotzdem als konfiguriert.
app.ai.providers.local.local=true
app.ai.providers.local.enabled=${LOCAL_AI_ENABLED:true}

# --- SOUL --------------------------------------------------------------------
# Identitaet des Mitarbeiters als eigene, versionierte Entitaet (Markdown + Frontmatter)
# statt als Prompt-String hier. Die Standard-SOULs liegen im Jar; eine zusaetzliche
# Location gewinnt bei gleicher Id und macht die SOUL ohne Rebuild austauschbar:
#   SOUL_LOCATIONS=classpath:souls/,file:/souls/
app.soul.locations=${SOUL_LOCATIONS:classpath:souls/}
app.soul.active=${SOUL_ACTIVE:forge}

# --- Aufgaben ----------------------------------------------------------------
# Wiederverwendbare, versionierte Auftraege als Markdown mit Frontmatter — gleiches
# Format wie SOULs. Zusaetzliche Location gewinnt bei gleicher Id.
app.tasks.locations=${TASK_LOCATIONS:classpath:tasks/}

# --- Agent -------------------------------------------------------------------
# Budget eines Laufs. Ein Agent mit Tools kann im Kreis laufen — die Grenzen sind
# Pflicht, nicht Komfort.
app.agent.max-tool-calls=${AGENT_MAX_TOOL_CALLS:20}
app.agent.max-calls-per-tool=${AGENT_MAX_CALLS_PER_TOOL:8}
app.agent.max-duration-ms=${AGENT_MAX_DURATION_MS:180000}
app.agent.history-limit=50

# --- Werkzeuge ---------------------------------------------------------------
app.tools.builtin-enabled=${TOOLS_BUILTIN_ENABLED:true}
# MCP-Server registrieren. Je Server ein Block unter eigener Id:
#   app.tools.mcp.<id>.transport = STDIO | SSE | HTTP
#   STDIO:      command + args (lokaler Prozess)
#   SSE/HTTP:   url
# Beispiel (Dateizugriff im Container-Verzeichnis /data):
#   app.tools.mcp.files.label=Dateien
#   app.tools.mcp.files.transport=STDIO
#   app.tools.mcp.files.command=npx
#   app.tools.mcp.files.args[0]=-y
#   app.tools.mcp.files.args[1]=@modelcontextprotocol/server-filesystem
#   app.tools.mcp.files.args[2]=/data

# --- Datenbank ---------------------------------------------------------------
# Runs und Traces. Ohne DB startet die Anwendung nicht — ein Lauf ohne Trace ist
# fuer die spaetere Lernschleife wertlos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agent}
spring.datasource.username=${DB_USER:agent}
spring.datasource.password=${DB_PASSWORD:agent}
spring.flyway.enabled=true

# --- App ---------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

management.endpoints.web.exposure.include=health,info
