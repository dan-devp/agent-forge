spring.application.name=forge-backend
server.port=8080

# Spring AI builds no ChatModels itself — ChatClientRegistry does, one per model file,
# so that several endpoints are usable side by side. Every modality must be switched off,
# not just chat, or the remaining autoconfigurations fail without a key.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# --- Data --------------------------------------------------------------------
# One directory for everything that is not code. files/<kind>/<id>/v<n>.md holds the
# authored entities (models, agents, tasks); db/ is mounted into Postgres by compose.
app.data-dir=${DATA_DIR:./data}
# Copy the bundled examples into an empty files/<kind> directory on first start.
app.seed=${DATA_SEED:true}

# --- Secrets -----------------------------------------------------------------
# A model file names an environment variable for its key; the value stays in the
# environment. The UI is offered only variables with this prefix, names only.
app.secrets.env-prefix=${SECRET_ENV_PREFIX:API_KEY_}

# --- Models ------------------------------------------------------------------
# Set to redirect every model call, whatever the files say. The test profile points it at a
# dead address so no automated test can reach a real endpoint.
app.models.base-url-override=${MODEL_BASE_URL_OVERRIDE:}

# --- Run budget --------------------------------------------------------------
# An agent with tools can loop forever — the limits are mandatory, not a convenience.
app.run.max-tool-calls=${RUN_MAX_TOOL_CALLS:20}
app.run.max-calls-per-tool=${RUN_MAX_CALLS_PER_TOOL:8}
app.run.max-duration-ms=${RUN_MAX_DURATION_MS:180000}
app.run.history-limit=${RUN_HISTORY_LIMIT:100}
# One batch = agent version x tasks x repetitions, executed one after another.
app.run.max-repetitions=${RUN_MAX_REPETITIONS:20}
app.run.max-batch-runs=${RUN_MAX_BATCH_RUNS:100}

# --- Training ----------------------------------------------------------------
# A session waits for its batch and, with approval: manual, for a human. How often it looks.
app.training.poll-ms=${TRAINING_POLL_MS:500}
app.training.history-limit=${TRAINING_HISTORY_LIMIT:50}

# --- Tools -------------------------------------------------------------------
app.tools.builtin-enabled=${TOOLS_BUILTIN_ENABLED:true}
# Fixed instant for the time tool (ISO-8601). Empty = wall clock. Set it for runs against
# mocks so two runs do not differ only because the clock moved on.
app.tools.fixed-time=${TOOLS_FIXED_TIME:}
# MCP servers, one block per server:
#   app.tools.mcp.<id>.transport = STDIO | SSE | HTTP
#   STDIO:      command + args      SSE/HTTP: url
# Example against tools/mock-mcp-server.py (enable via MCP_MOCK_ENABLED=true):
app.tools.mcp.mock.label=Mock-MCP
app.tools.mcp.mock.transport=HTTP
app.tools.mcp.mock.url=${MCP_MOCK_URL:http://localhost:3333/mcp}
app.tools.mcp.mock.enabled=${MCP_MOCK_ENABLED:false}

# --- Database ----------------------------------------------------------------
# Runs, traces and verdicts. Without a database the application does not start — a run
# without a trace is worthless.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/forge}
spring.datasource.username=${DB_USER:forge}
spring.datasource.password=${DB_PASSWORD:forge}
spring.flyway.enabled=true

# --- App ---------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

management.endpoints.web.exposure.include=health,info
