spring.application.name=agent-backend
server.port=8080

# Spring AI builds no ChatModels itself — ChatClientRegistry does, from
# app.ai.providers.*, so that several endpoints are usable in parallel.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# --- Model endpoints ---------------------------------------------------------
# All endpoints speak the OpenAI protocol. A local server is therefore not a
# special case, just another base-url.
# ALWAYS include the version path in base-url, e.g. .../v1
app.ai.default-provider=${AI_DEFAULT_PROVIDER:openai}

# OpenAI (cloud)
app.ai.providers.openai.label=OpenAI (Cloud)
app.ai.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.providers.openai.api-key=${OPENAI_API_KEY:not-set}
app.ai.providers.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.providers.openai.temperature=0.7

# Local model — any OpenAI-compatible server:
#   LM Studio    http://localhost:1234/v1
#   Ollama       http://localhost:11434/v1
#   vLLM         http://localhost:8000/v1
#   llama.cpp    http://localhost:8080/v1
# From inside the container: host.docker.internal instead of localhost.
app.ai.providers.local.label=Lokal (OpenAI-kompatibel)
app.ai.providers.local.base-url=${LOCAL_AI_BASE_URL:http://localhost:1234/v1}
app.ai.providers.local.api-key=${LOCAL_AI_API_KEY:not-needed}
app.ai.providers.local.model=${LOCAL_AI_MODEL:local-model}
app.ai.providers.local.temperature=0.7
# local=true: no real API key needed, the provider still counts as configured.
app.ai.providers.local.local=true
app.ai.providers.local.enabled=${LOCAL_AI_ENABLED:true}

# --- SOUL --------------------------------------------------------------------
# The co-worker's identity as its own versioned entity (Markdown + front matter)
# instead of a prompt string here. The default SOULs ship in the jar; an additional
# location wins for the same id and makes a SOUL replaceable without a rebuild:
#   SOUL_LOCATIONS=classpath:souls/,file:/souls/
app.soul.locations=${SOUL_LOCATIONS:classpath:souls/}
app.soul.active=${SOUL_ACTIVE:forge}

# --- Tasks -------------------------------------------------------------------
# Reusable, versioned goals as Markdown with front matter — same format as SOULs.
# An additional location wins for the same id.
app.tasks.locations=${TASK_LOCATIONS:classpath:tasks/}

# --- Strategy profiles -------------------------------------------------------
# Which continual-learning strategies are active, as a versioned Markdown entity.
# baseline = none. An additional location wins for the same id.
app.profiles.locations=${PROFILE_LOCATIONS:classpath:profiles/}
app.profiles.default-profile=${PROFILE_DEFAULT:baseline}

# --- Agent -------------------------------------------------------------------
# Budget of a run. An agent with tools can loop forever — the limits are
# mandatory, not a convenience.
app.agent.max-tool-calls=${AGENT_MAX_TOOL_CALLS:20}
app.agent.max-calls-per-tool=${AGENT_MAX_CALLS_PER_TOOL:8}
app.agent.max-duration-ms=${AGENT_MAX_DURATION_MS:180000}
app.agent.history-limit=50
# Global cap on rejections per strategy in the beforeFinish loop.
app.agent.max-verify-rounds=${AGENT_MAX_VERIFY_ROUNDS:3}
# Upper bound for repetitions in one series.
app.agent.max-series-repetitions=${AGENT_MAX_SERIES_REPETITIONS:50}

# --- Tools -------------------------------------------------------------------
app.tools.builtin-enabled=${TOOLS_BUILTIN_ENABLED:true}
# Fixed instant for the time tool (ISO-8601). Empty = wall clock. Set it for runs
# against mocks so two runs do not differ only because the clock moved on.
app.tools.fixed-time=${TOOLS_FIXED_TIME:}
# Register MCP servers. One block per server under its own id:
#   app.tools.mcp.<id>.transport = STDIO | SSE | HTTP
#   STDIO:      command + args (local process)
#   SSE/HTTP:   url
# Example (file access inside the container directory /data):
#   app.tools.mcp.files.label=Dateien
#   app.tools.mcp.files.transport=STDIO
#   app.tools.mcp.files.command=npx
#   app.tools.mcp.files.args[0]=-y
#   app.tools.mcp.files.args[1]=@modelcontextprotocol/server-filesystem
#   app.tools.mcp.files.args[2]=/data

# --- Database ----------------------------------------------------------------
# Runs, traces and scores. Without a database the application does not start —
# a run without a trace is worthless for the later learning loop.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agent}
spring.datasource.username=${DB_USER:agent}
spring.datasource.password=${DB_PASSWORD:agent}
spring.flyway.enabled=true

# --- App ---------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

management.endpoints.web.exposure.include=health,info
