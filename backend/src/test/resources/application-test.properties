# Testprofil — ergaenzt application.properties, ersetzt sie nicht.
#
# Automatische Tests duerfen NIEMALS ein echtes Modell aufrufen. Echte Modellaufrufe
# macht ausschliesslich der Nutzer ueber die UI.
#
# Die Provider zeigen deshalb fest auf eine nicht erreichbare Adresse — auch dann, wenn
# im Terminal LOCAL_AI_BASE_URL oder OPENAI_API_KEY gesetzt sind. Ein Test, der
# versehentlich ein Modell aufruft, scheitert sofort am Verbindungsfehler, statt still
# Geld und Kontingent zu verbrauchen.
#
# Aktiviert ueber spring.profiles.active=test in build.gradle. Eine Datei namens
# application.properties waere hier falsch: sie wuerde die aus main komplett ersetzen.
app.ai.providers.openai.base-url=http://127.0.0.1:1/v1
app.ai.providers.openai.api-key=not-set
app.ai.providers.openai.model=test-modell

app.ai.providers.local.base-url=http://127.0.0.1:1/v1
app.ai.providers.local.api-key=not-needed
app.ai.providers.local.model=test-modell
