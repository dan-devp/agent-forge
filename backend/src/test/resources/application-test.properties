# Test profile — complements application.properties, does not replace it.
#
# Automated tests must NEVER call a real model. Real model calls are made
# exclusively by the user through the UI.
#
# The providers therefore point to an unreachable address — even when
# LOCAL_AI_BASE_URL or OPENAI_API_KEY are set in the terminal. A test that
# accidentally calls a model fails immediately with a connection error instead of
# silently spending money and quota.
#
# Activated via spring.profiles.active=test in build.gradle. A file named
# application.properties would be wrong here: it would replace the one from main entirely.
app.ai.providers.openai.base-url=http://127.0.0.1:1/v1
app.ai.providers.openai.api-key=not-set
app.ai.providers.openai.model=test-model

app.ai.providers.local.base-url=http://127.0.0.1:1/v1
app.ai.providers.local.api-key=not-needed
app.ai.providers.local.model=test-model
