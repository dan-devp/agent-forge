# Test profile — complements application.properties, does not replace it.
#
# Automated tests must NEVER call a real model. Real model calls are made exclusively by
# the user through the UI. Model files may say anything; this override redirects every call
# to an unreachable address, so a test that accidentally calls a model fails at once with a
# connection error instead of silently spending money. NoRealModelCallsTests guards it.
#
# Activated via spring.profiles.active=test in build.gradle.
app.models.base-url-override=http://127.0.0.1:1/v1

# Own data directory, seeded with the bundled examples so the store is never empty.
app.data-dir=build/test-data
app.seed=true

# No key with the secret prefix is set in tests; a model that needs one is "not usable".
app.secrets.env-prefix=API_KEY_
