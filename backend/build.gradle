plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	springAiVersion = '2.0.1'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// SOUL-Dateien sind Markdown mit YAML-Frontmatter — direkt genutzt, daher explizit.
	implementation 'org.yaml:snakeyaml'

	// --- Persistenz --------------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Boot 4: die Flyway-Autoconfiguration liegt im Starter, nicht mehr in
	// spring-boot-autoconfigure. Mit 'flyway-core' allein laeuft keine Migration.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// --- Spring AI ---------------------------------------------------------
	// Provider-agnostisch: weitere Starter einfach ergaenzen und ueber
	// spring.ai.model.chat=<provider> in application.properties auswaehlen.
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// implementation 'org.springframework.ai:spring-ai-starter-model-ollama'      // lokal
	// implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'   // cloud
	// implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-client'           // Tools via MCP
	// -----------------------------------------------------------------------

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Postgres im Test statt H2: die Migration ist postgres-spezifisch, und ein
	// abweichender Test-Dialekt wuerde genau die Fehler verstecken, die zaehlen.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}





