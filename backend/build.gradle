plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	springAiVersion = '2.0.1'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// SOUL files are Markdown with YAML front matter — used directly, hence explicit.
	implementation 'org.yaml:snakeyaml'

	// --- Persistence -------------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Boot 4: the Flyway autoconfiguration lives in the starter, no longer in
	// spring-boot-autoconfigure. With 'flyway-core' alone no migration runs.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// --- Spring AI ---------------------------------------------------------
	// Provider-agnostic: add further starters and select them via
	// spring.ai.model.chat=<provider> in application.properties.
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// implementation 'org.springframework.ai:spring-ai-starter-model-ollama'      // local
	// implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'   // cloud
	// implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-client'           // Tools via MCP
	// -----------------------------------------------------------------------

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Postgres in tests instead of H2: the migration is Postgres-specific, and a
	// different test dialect would hide exactly the errors that matter.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Force the test profile: providers point to a dead address there so no
	// automated test ever calls a real model.
	systemProperty 'spring.profiles.active', 'test'
}





